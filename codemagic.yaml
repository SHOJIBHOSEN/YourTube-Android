workflows:
  yourtube-android:
    name: YourTube Android Debug
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
    scripts:
      - name: Check Gradle
        script: gradle --version
      - name: Build debug APK
        script: gradle --no-daemon --stacktrace assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
